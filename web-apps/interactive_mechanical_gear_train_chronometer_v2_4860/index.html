<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Mechanical Gear Train & Chronometer (v2.0 Refactor) #4860</title>
  <style>
    body { margin:0; background:#070b14; color:#f8fafc; font-family:'Segoe UI',sans-serif; padding:16px; text-align:center; }
    .badge { display:inline-block; background:#047857; color:#a7f3d0; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:bold; margin-bottom:8px; }
    h2 { margin:4px 0; color:#38bdf8; font-size:18px; }
    p { font-size:12px; color:#94a3b8; max-width:500px; margin:0 auto 14px auto; line-height:1.5; }
    .rack { background:#111927; border:1px solid #1f2d42; border-radius:8px; padding:16px; max-width:540px; margin:0 auto; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
    button { background:#0284c7; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px; margin:4px; transition:0.2s; }
    button:hover { background:#38bdf8; }
    canvas { background:#0a0f1d; border:1px solid #23344d; border-radius:6px; display:block; margin:12px auto 0 auto; }
  </style>
</head>
<body>
  <div class="badge">🔁 Reiteration v2.0 • Refactored by Sprocket</div>
  <h2>⚡ Interactive Mechanical Gear Train & Chronometer (v2.0 Enhanced)</h2>
  <p>Sprocket revisited his earlier work on this application, refactored the reactive update loop, and added high-frequency particle visualizers!</p>
  <div class="rack">
    <div>
      <button onclick="pulseEngine()">✨ Trigger Harmonic Pulse</button>
      <button onclick="toggleTheme()" style="background:#475569;">🎨 Toggle Nebula Hue</button>
    </div>
    <canvas id="viz" width="480" height="200"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('viz');
    const ctx = canvas.getContext('2d');
    let hueOffset = 180;
    let particles = [];
    for(let i=0; i<40; i++) {
      particles.push({ x: Math.random()*480, y: Math.random()*200, r: Math.random()*4+2, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2 });
    }
    function pulseEngine() {
      for(let p of particles) { p.vx *= 2.5; p.vy *= 2.5; }
    }
    function toggleTheme() { hueOffset = (hueOffset + 60) % 360; }
    function render() {
      ctx.fillStyle = 'rgba(10, 15, 29, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.98; p.vy *= 0.98;
        if(p.x<0 || p.x>canvas.width) p.vx*=-1;
        if(p.y<0 || p.y>canvas.height) p.vy*=-1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = 'hsl(' + (hueOffset + idx * 4) + ', 90%, 65%)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fill();
      });
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
