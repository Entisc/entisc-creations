<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A* & Dijkstra Pathfinding Visualizer</title>
  <style>
    body { margin:0; background:#070b14; color:#f1f5f9; font-family:'Segoe UI',system-ui,sans-serif; padding:12px; display:flex; flex-direction:column; align-items:center; user-select:none; }
    .header { width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #1e293b; padding-bottom:6px; }
    h3 { margin:0; color:#38bdf8; font-size:16px; display:flex; align-items:center; gap:8px; }
    .badge { background:#0369a1; color:#e0f2fe; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:bold; }
    .toolbar { width:100%; max-width:680px; background:#0f172a; border:1px solid #1e293b; border-radius:6px; padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:11px; }
    .tool-group { display:flex; gap:6px; align-items:center; }
    select, input[type=range] { background:#070a0f; color:#38bdf8; border:1px solid #334e68; border-radius:4px; padding:3px 6px; font-size:11px; }
    button { background:#0284c7; color:#fff; border:none; padding:5px 11px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px; transition:0.15s; }
    button:hover { background:#38bdf8; }
    button.active-tool { background:#f59e0b; color:#0b0f19; box-shadow:0 0 8px #f59e0b; }
    .hud { width:100%; max-width:680px; display:flex; justify-content:space-between; background:#0b111e; border:1px solid #1e293b; border-radius:4px; padding:4px 12px; margin-bottom:8px; font-size:11px; font-family:monospace; color:#94a3b8; }
    .hud b { color:#38bdf8; }
    canvas { background:#070a0f; border:2px solid #1e293b; border-radius:6px; cursor:crosshair; box-shadow:0 8px 24px rgba(0,0,0,0.6); }
    .legend { width:100%; max-width:680px; display:flex; justify-content:center; gap:14px; font-size:11px; color:#94a3b8; margin-top:8px; flex-wrap:wrap; }
    .dot { width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:4px; vertical-align:middle; }
  </style>
</head>
<body>
  <div class="header">
    <h3>🧭 A* & Dijkstra Interactive Pathfinding <span class="badge">Sprocket Lab</span></h3>
    <span style="font-size:11px; color:#64748b;">Autonomous Algorithm Suite</span>
  </div>

  <div class="toolbar">
    <div class="tool-group">
      <label>Algo:
        <select id="algo-select">
          <option value="astar">A* Heuristic Search</option>
          <option value="dijkstra">Dijkstra's Algorithm</option>
          <option value="greedy">Greedy Best-First</option>
          <option value="bfs">Breadth-First (BFS)</option>
        </select>
      </label>
      <button id="btn-run" onclick="startSearch()" style="background:#10b981; color:#fff;">▶️ Run Search</button>
      <button onclick="clearPath()" style="background:#475569;">🧹 Clear Path</button>
      <button onclick="clearAll()" style="background:#dc2626;">🗑️ Reset All</button>
    </div>
    <div class="tool-group">
      <button id="tool-wall" class="active-tool" onclick="setTool('wall')">✏️ Wall</button>
      <button id="tool-erase" onclick="setTool('erase')">🧽 Erase</button>
      <button id="tool-start" onclick="setTool('start')">🟢 Start</button>
      <button id="tool-goal" onclick="setTool('goal')">🎯 Goal</button>
      <button onclick="generateMaze()" style="background:#8b5cf6;">🎲 Maze</button>
    </div>
    <div class="tool-group">
      <label>Speed:
        <input type="range" id="speed-slider" min="0" max="60" value="18" />
      </label>
    </div>
  </div>

  <div class="hud">
    <span>Explored: <b id="hud-explored">0</b></span>
    <span>Path Length: <b id="hud-path">0</b></span>
    <span>Duration: <b id="hud-time">0ms</b></span>
    <span>Status: <b id="hud-status" style="color:#10b981;">Ready</b></span>
  </div>

  <canvas id="gridCanvas" width="520" height="520"></canvas>

  <div class="legend">
    <span><span class="dot" style="background:#22c55e;"></span>Start</span>
    <span><span class="dot" style="background:#ef4444;"></span>Goal</span>
    <span><span class="dot" style="background:#334155;"></span>Wall</span>
    <span><span class="dot" style="background:rgba(147, 51, 234, 0.7);"></span>Explored Frontier</span>
    <span><span class="dot" style="background:#00ffff; box-shadow:0 0 6px #00ffff;"></span>Optimal Path</span>
  </div>

  <script>
    const ROWS = 26, COLS = 26;
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const CELL = canvas.width / COLS;

    let start = { r: 3, c: 3 };
    let goal = { r: 22, c: 22 };
    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let visitedNodes = [];
    let optimalPath = [];
    let currentTool = 'wall';
    let isMouseDown = false;
    let isSearching = false;
    let searchRunId = 0;

    function setTool(tool) {
      currentTool = tool;
      ['wall', 'erase', 'start', 'goal'].forEach(t => {
        const b = document.getElementById('tool-' + t);
        if (b) b.className = (t === tool) ? 'active-tool' : '';
      });
    }

    function draw() {
      ctx.fillStyle = '#070a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * CELL, y = r * CELL;
          if (grid[r][c] === 1) {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 1, y + 1, CELL - 2, CELL - 2);
          } else {
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, CELL, CELL);
          }
        }
      }

      visitedNodes.forEach(node => {
        if ((node.r === start.r && node.c === start.c) || (node.r === goal.r && node.c === goal.c)) return;
        ctx.fillStyle = 'rgba(147, 51, 234, 0.65)';
        ctx.fillRect(node.c * CELL + 2, node.r * CELL + 2, CELL - 4, CELL - 4);
      });

      optimalPath.forEach(node => {
        if ((node.r === start.r && node.c === start.c) || (node.r === goal.r && node.c === goal.c)) return;
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 8;
        ctx.fillRect(node.c * CELL + 3, node.r * CELL + 3, CELL - 6, CELL - 6);
        ctx.shadowBlur = 0;
      });

      // Start Node (Green Glow)
      ctx.fillStyle = '#22c55e';
      ctx.shadowColor = '#22c55e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc((start.c + 0.5) * CELL, (start.r + 0.5) * CELL, CELL * 0.38, 0, Math.PI * 2);
      ctx.fill();

      // Goal Node (Red Glow)
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc((goal.c + 0.5) * CELL, (goal.r + 0.5) * CELL, CELL * 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function applyCellInteraction(e) {
      const rect = canvas.getBoundingClientRect();
      const c = Math.floor((e.clientX - rect.left) / CELL);
      const r = Math.floor((e.clientY - rect.top) / CELL);
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

      if (currentTool === 'start') {
        if (grid[r][c] !== 1 && (r !== goal.r || c !== goal.c)) {
          start = { r, c };
          clearPath();
        }
      } else if (currentTool === 'goal') {
        if (grid[r][c] !== 1 && (r !== start.r || c !== start.c)) {
          goal = { r, c };
          clearPath();
        }
      } else if (currentTool === 'wall') {
        if ((r !== start.r || c !== start.c) && (r !== goal.r || c !== goal.c)) {
          grid[r][c] = 1;
          draw();
        }
      } else if (currentTool === 'erase') {
        grid[r][c] = 0;
        draw();
      }
    }

    canvas.addEventListener('mousedown', e => { isMouseDown = true; applyCellInteraction(e); });
    canvas.addEventListener('mousemove', e => { if (isMouseDown) applyCellInteraction(e); });
    window.addEventListener('mouseup', () => isMouseDown = false);

    function clearPath() {
      searchRunId++;
      isSearching = false;
      visitedNodes = [];
      optimalPath = [];
      document.getElementById('hud-explored').innerText = '0';
      document.getElementById('hud-path').innerText = '0';
      document.getElementById('hud-time').innerText = '0ms';
      document.getElementById('hud-status').innerText = 'Ready';
      document.getElementById('hud-status').style.color = '#10b981';
      document.getElementById('btn-run').innerText = '▶️ Run Search';
      draw();
    }

    function clearAll() {
      clearPath();
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      draw();
    }

    function generateMaze() {
      clearAll();
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if ((r === start.r && c === start.c) || (r === goal.r && c === goal.c)) continue;
          if (r % 2 === 1 && c % 2 === 1) {
            grid[r][c] = 1;
            const dirs = [{r:r-1,c}, {r:r+1,c}, {r,c:c-1}, {r,c:c+1}];
            const d = dirs[Math.floor(Math.random() * dirs.length)];
            if (d.r >= 0 && d.r < ROWS && d.c >= 0 && d.c < COLS) {
              if ((d.r !== start.r || d.c !== start.c) && (d.r !== goal.r || d.c !== goal.c)) {
                grid[d.r][d.c] = 1;
              }
            }
          }
          if (Math.random() < 0.12) grid[r][c] = 1;
        }
      }
      grid[start.r][start.c] = 0;
      grid[goal.r][goal.c] = 0;
      draw();
    }

    async function startSearch() {
      if (isSearching) {
        clearPath();
        return;
      }

      visitedNodes = [];
      optimalPath = [];
      isSearching = true;
      searchRunId++;
      const currentRun = searchRunId;
      document.getElementById('btn-run').innerText = '⏹️ Stop Search';
      document.getElementById('hud-status').innerText = 'Searching...';
      document.getElementById('hud-status').style.color = '#f59e0b';

      const algo = document.getElementById('algo-select').value;
      const speed = parseInt(document.getElementById('speed-slider').value, 10);
      const startTime = performance.now();

      const open = [{ r: start.r, c: start.c, g: 0, h: dist(start, goal) }];
      const cameFrom = {};
      const gScore = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
      const closed = new Set();
      gScore[start.r][start.c] = 0;

      while (open.length > 0 && isSearching && searchRunId === currentRun) {
        open.sort((a, b) => {
          if (algo === 'dijkstra' || algo === 'bfs') return a.g - b.g;
          if (algo === 'greedy') return a.h - b.h;
          return (a.g + a.h) - (b.g + b.h);
        });

        const curr = open.shift();
        const key = curr.r + ',' + curr.c;
        if (closed.has(key)) continue;
        closed.add(key);
        visitedNodes.push(curr);

        if (visitedNodes.length % 4 === 0) {
          document.getElementById('hud-explored').innerText = visitedNodes.length;
          document.getElementById('hud-time').innerText = Math.round(performance.now() - startTime) + 'ms';
          draw();
          if (speed > 0) await new Promise(r => setTimeout(r, speed));
        }

        if (curr.r === goal.r && curr.c === goal.c) {
          let traceKey = key;
          while (cameFrom[traceKey]) {
            const p = cameFrom[traceKey];
            optimalPath.unshift(p);
            traceKey = p.r + ',' + p.c;
          }
          isSearching = false;
          document.getElementById('hud-explored').innerText = visitedNodes.length;
          document.getElementById('hud-path').innerText = optimalPath.length;
          document.getElementById('hud-time').innerText = Math.round(performance.now() - startTime) + 'ms';
          document.getElementById('hud-status').innerText = 'Path Found! ✨';
          document.getElementById('hud-status').style.color = '#38bdf8';
          document.getElementById('btn-run').innerText = '▶️ Run Search';
          draw();
          return;
        }

        const neighbors = [
          { r: curr.r + 1, c: curr.c }, { r: curr.r - 1, c: curr.c },
          { r: curr.r, c: curr.c + 1 }, { r: curr.r, c: curr.c - 1 }
        ];

        for (const n of neighbors) {
          if (n.r >= 0 && n.r < ROWS && n.c >= 0 && n.c < COLS && grid[n.r][n.c] === 0) {
            const tentG = gScore[curr.r][curr.c] + 1;
            if (tentG < gScore[n.r][n.c]) {
              cameFrom[n.r + ',' + n.c] = curr;
              gScore[n.r][n.c] = tentG;
              if (!closed.has(n.r + ',' + n.c)) {
                open.push({ r: n.r, c: n.c, g: tentG, h: dist(n, goal) });
              }
            }
          }
        }
      }

      isSearching = false;
      document.getElementById('btn-run').innerText = '▶️ Run Search';
      document.getElementById('hud-status').innerText = 'No Path Possible 🚫';
      document.getElementById('hud-status').style.color = '#ef4444';
      draw();
    }

    function dist(a, b) {
      return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
    }

    draw();
  </script>
</body>
</html>
